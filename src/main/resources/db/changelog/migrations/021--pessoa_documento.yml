databaseChangeLog:
  - changeSet:
      id: 21
      author: Jônatas
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: PESSOA_DOCUMENTO
      changes:
        - createTable:
            tableName: PESSOA_DOCUMENTO
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pessoa_documento
              - column:
                  name: id_documento_legado
                  type: bigint
              - column:
                  name: id_pessoa_legado
                  type: bigint
              - column:
                  name: id_pessoa
                  type: bigint
              - column:
                  name: tipo_documento
                  type: varchar(3)
              - column:
                  name: documento
                  type: varchar(255)
              - column:
                  name: id_estado
                  type: bigint
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_PESSOA_DOCUMENTOS
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_pessoa
            baseTableName: PESSOA_DOCUMENTO
            constraintName: FK_PESSOA_DOCUMENTO_PESSOA
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: PESSOA
        - addForeignKeyConstraint:
            baseColumnNames: id_estado
            baseTableName: PESSOA_DOCUMENTO
            constraintName: FK_PESSOA_DOCUMENTO_ESTADO
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: ESTADO

