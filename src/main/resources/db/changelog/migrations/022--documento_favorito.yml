databaseChangeLog:
  - changeSet:
      id: 22
      author: Jônatas
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: DOCUMENTO_FAVORITO
      changes:
        - createTable:
            tableName: DOCUMENTO_FAVORITO
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_documento_favorito
              - column:
                  name: id_usuario
                  type: varchar(255)
              - column:
                  name: id_processo
                  type: bigint
              - column:
                  name: numero_pagina
                  type: bigint
              - column:
                  name: comentario
                  type: varchar(255)
              - column:
                  name: fonte_dados
                  type: varchar(255)
              - column:
                  name: id_documento
                  type: bigint
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQUENCIA_DOCUMENTO_FAVORITO
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_processo
            baseTableName: DOCUMENTO_FAVORITO
            constraintName: FK_DOCUMENTO_FAVORITO_PROCESSO
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: PROCESSO
        - addForeignKeyConstraint:
            baseColumnNames: id_documento
            baseTableName: DOCUMENTO_FAVORITO
            constraintName: FK_DOCUMENTO_FAV_PROCESSO_DOC
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: processo_documento

