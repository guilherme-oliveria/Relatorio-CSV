databaseChangeLog:
  - include:
      file: ./db/changelog/types.yml
  - changeSet:
      id: 72
      author: Guilherme oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: CADEIA_CERTIFICADO
      changes:
        - createSequence:
            sequenceName: SEQ_CAD_CERTIFICADO
            startValue: 1
            incrementBy: 1
        - createTable:
            tableName: CADEIA_CERTIFICADO
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
              - column:
                  name: hash_cadeia_certificado
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: cadeia_certificado
                  type: CLOB
                  constraints:
                    nullable: false
