databaseChangeLog:
  - changeSet:
      id: 21
      author: Jônatas
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: MODELO_MINUTA
      changes:
        - createTable:
            tableName: MODELO_MINUTA
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_modelo_minuta
              - column:
                  name: descricao
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: template
                  type: clob
                  constraints:
                    nullable: false
              - column:
                  name: visibilidade
                  type: varchar(50)
              - column:
                  name: id_orgao_julgador
                  type: bigint
              - column:
                  name: id_tipo_documento
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: id_usuario_atualizacao
                  type: varchar(255)
              - column:
                  name: data_exclusao
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: id_usuario_exclusao
                  type: varchar(255)
              - column:
                  name: atualizacao
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: id_usuario
                  type: varchar(255)
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQUENCIA_MODELO_MINUTA
            startValue: 1
