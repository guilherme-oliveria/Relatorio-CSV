databaseChangeLog:
  - changeSet:
      id: 14
      author: Jônatas
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: MINUTA_VERSAO
      changes:
        - createTable:
            tableName: MINUTA_VERSAO
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_minuta_versao
              - column:
                  name: descricao
                  type: varchar(255)
              - column:
                  name: minuta_html
                  type: clob
              - column:
                  name: id_minuta
                  type: bigint
              - column:
                  name: data_versao
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: versao
                  type: integer
              - column:
                  name: nome_autor
                  type: varchar(255)
              - column:
                  name: autor_versao
                  type: varchar(255)
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQUENCIA_MINUTA_VERSAO
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_minuta
            baseTableName: MINUTA_VERSAO
            constraintName: FK_MINUTA_VERSAO_MINUTA
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: MINUTA
