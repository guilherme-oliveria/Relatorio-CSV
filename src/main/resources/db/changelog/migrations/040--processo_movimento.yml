databaseChangeLog:
  - changeSet:
      id: 40
      author: Andrew
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: processo_movimento
      changes:
        - createTable:
            tableName: processo_movimento
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_processo_movimento
              - column:
                  name: id_proc_mov_legado
                  type: bigint
              - column:
                  name: id_processo
                  type: bigint
              - column:
                  name: cd_evento
                  type: bigint
              - column:
                  name: id_processo_documento
                  type: bigint
              - column:
                  name: descricao
                  type: clob
              - column:
                  name: in_visibilidade_externa
                  type: boolean
              - column:
                  name: in_ativo
                  type: boolean
              - column:
                  name: nome_usuario
                  type: varchar(255)
              - column:
                  name: cpf_usuario
                  type: varchar(255)
              - column:
                  name: data_atualizacao
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: id_orgao_julgador
                  type: int
              - column:
                  name: id_orgao_julgador_colegiado
                  type: int
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQUENCIA_PROCESSO_MOVIMENTO
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_processo
            baseTableName: processo_movimento
            constraintName: FK_PROCESSO_MOVIMENTO_PROCESSO
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: processo
        - addForeignKeyConstraint:
            baseColumnNames: id_processo_documento
            baseTableName: processo_movimento
            constraintName: FK_PROCESSO_MOVIMENTO_PROC_DOC
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: processo_documento

