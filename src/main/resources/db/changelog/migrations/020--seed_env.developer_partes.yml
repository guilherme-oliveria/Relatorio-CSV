databaseChangeLog:
  - include:
      file: ./db/changelog/types.yml
  - changeSet:
      id: 20
      context: developer
      author: Andrew May
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM pessoa
      changes:
        - loadData:
            columns:
              - column:
                  name: id
                  type: numeric
              - column:
                  name: id_pessoa_legado
                  type: numeric
              - column:
                  name: nome
                  type: string
              - column:
                  name: data_nascimento
                  type: datetime
              - column:
                  name: in_tipo_pessoa
                  type: string
            encoding: UTF-8
            file: ./db/changelog/seeds/csv/pessoa.csv
            tableName: pessoa
        - loadData:
            columns:
              - column:
                  name: id
                  type: numeric
              - column:
                  name: id_parte_legado
                  type: numeric
              - column:
                  name: tipo_parte
                  type: string
              - column:
                  name: tipo_polo
                  type: string
              - column:
                  name: id_pessoa
                  type: numeric
              - column:
                  name: id_processo
                  type: numeric
            encoding: UTF-8
            file: ./db/changelog/seeds/csv/processo_parte.csv
            tableName: processo_parte
