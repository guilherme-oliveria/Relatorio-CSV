databaseChangeLog:
  - changeSet:
      id: 55
      author: Andrew
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: processo
                columnName: digital
      changes:
        - addColumn:
            tableName: processo
            columns:
              - column:
                  name: digital
                  type: varchar(255)
              - column:
                  name: id_colegiado
                  type: varchar(255)
              - column:
                  name: nivel_sigilo
                  type: int

