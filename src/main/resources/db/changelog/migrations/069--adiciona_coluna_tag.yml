databaseChangeLog:
  - include:
      file: ./db/changelog/types.yml
  - changeSet:
      id: 69
      author: Guilherme Oliveira
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: TAG
                columnName: url
      changes:
        - addColumn:
            tableName: TAG
            columns:
              - column:
                  name: url
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: aviso
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: apenas_meu_gabinete
                  type: boolean
                  constraints:
                    nullable: true
