databaseChangeLog:
  - changeSet:
      id: 23
      author: Jônatas
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: PROCESSO_EXPEDIENTE
      changes:
        - createTable:
            tableName: PROCESSO_EXPEDIENTE
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_processo_expediente
              - column:
                  name: id_processo
                  type: bigint
              - column:
                  name: idlegado
                  type: bigint
              - column:
                  name: dtcriacao
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: dtexclusao
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: meioexpediente
                  type: varchar(255)
              - column:
                  name: urgencia
                  type: boolean
              - column:
                  name: documentoexistente
                  type: boolean
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_PROCESSO_EXPEDIENTE
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_processo
            baseTableName: PROCESSO_EXPEDIENTE
            constraintName: FK_PROCESSO_EXPED_PROCESSO
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: PROCESSO
        - createTable:
            tableName: PROCESSO_PARTE_EXPEDIENTE
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_processo_parte_expediente
              - column:
                  name: id_processo_expediente
                  type: bigint
                  constraints:
                    allownull: false
              - column:
                  name: id_processo_parte
                  type: bigint
                  constraints:
                    allownull: false
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_PROCESSO_PARTE_EXPEDIENTE
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_processo_expediente
            baseTableName: PROCESSO_PARTE_EXPEDIENTE
            constraintName: FK_PROCESSO_PARTE_EXPED_EXPED
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: PROCESSO_EXPEDIENTE
        - addForeignKeyConstraint:
            baseColumnNames: id_processo_parte
            baseTableName: PROCESSO_PARTE_EXPEDIENTE
            constraintName: FK_PROCESSO_PARTE_EXPED_PARTE
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: PROCESSO_PARTE
