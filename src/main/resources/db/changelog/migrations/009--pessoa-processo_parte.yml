databaseChangeLog:
  - changeSet:
      id: 9
      author: Jônatas
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: PESSOA
      changes:
        - createTable:
            tableName: PESSOA
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pessoa
              - column:
                  name: id_pessoa_legado
                  type: BIGINT
              - column:
                  name: sistema
                  type: varchar(255)
              - column:
                  name: nome
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: data_nascimento
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: data_obito
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: in_tipo_pessoa
                  type: varchar(256)
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQUENCIA_PESSOA
            startValue: 10
        - addUniqueConstraint:
            columnNames: id_pessoa_legado,sistema
            tableName: PESSOA
        - createTable:
            tableName: PROCESSO_PARTE
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_processo_parte
              - column:
                  name: id_parte_legado
                  type: BIGINT
                  constraints:
                    unique: true
              - column:
                  name: tipo_parte
                  type: varchar(25)
              - column:
                  name: procuradoria
                  type: varchar(255)
              - column:
                  name: tipo_polo
                  type: varchar(255)
              - column:
                  name: id_pessoa
                  type: BIGINT
                  constraints:
                    - nullable: false
              - column:
                  name: id_processo
                  type: BIGINT
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQUENCIA_PROCESSO_PARTE
            startValue: 2072
        - addForeignKeyConstraint:
            baseColumnNames: id_pessoa
            baseTableName: processo_parte
            constraintName: FK_PROCESSO_PARTE_PESSOA
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: PESSOA
