databaseChangeLog:
  - changeSet:
      id: 53
      author: Paulo Joge
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: CONTA
      changes:
        - createTable:
            tableName: CONTA
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_conta
              - column:
                  name: banco
                  type: varchar(255)
              - column:
                  name: agencia
                  type: varchar(255)
              - column:
                  name: operacao
                  type: varchar(255)
              - column:
                  name: numero_conta
                  type: varchar(255)
              - column:
                  name: digito_verificador
                  type: varchar(255)
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_CONTA
            startValue: 1
        - createTable:
            tableName: CONTA_JUDICIAL
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_conta_judicial
              - column:
                  name: cod_legado
                  type: varchar(255)
              - column:
                  name: nome_beneficiario
                  type: varchar(255)
              - column:
                  name: agencia
                  type: varchar(255)
              - column:
                  name: numero_conta
                  type: varchar(255)
              - column:
                  name: digito_verificador
                  type: varchar(255)
              - column:
                  name: cod_banco
                  type: varchar(255)
              - column:
                  name: produto
                  type: varchar(255)
              - column:
                  name: valor_guia
                  type: decimal
              - column:
                  name: valor_atualizado
                  type: decimal
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_CONTA_JUDICIAL
            startValue: 1
        - createTable:
            tableName: ALVARA
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_alvara
              - column:
                  name: id_minuta
                  type: BIGINT
              - column:
                  name: data_cadastro
                  type: java.sql.Types.TIMESTAMP
              - column:
                  name: requisitante
                  type: varchar(255)
              - column:
                  name: cpf_requisitante
                  type: varchar(255)
              - column:
                  name: ativo
                  type: boolean
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_ALVARA
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_minuta
            baseTableName: ALVARA
            constraintName: FK_ALVARA_MINUTA
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: MINUTA
        - createTable:
            tableName: PAGAMENTO_ALVARA
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pagamento_alvara
              - column:
                  name: nome_favorecido
                  type: varchar(255)
              - column:
                  name: doc_favorecido
                  type: varchar(255)
              - column:
                  name: nome_sacador
                  type: varchar(255)
              - column:
                  name: documento_sacador
                  type: varchar(255)
              - column:
                  name: nome_sacador_2
                  type: varchar(255)
              - column:
                  name: documento_sacador_2
                  type: varchar(255)
              - column:
                  name: valor
                  type: decimal
              - column:
                  name: forma_pagamento
                  type: varchar(255)
              - column:
                  name: com_atualizacao
                  type: boolean
              - column:
                  name: enviado
                  type: boolean
              - column:
                  name: ativo
                  type: boolean
              - column:
                  name: id_conta
                  type: BIGINT
              - column:
                  name: id_alvara
                  type: BIGINT
              - column:
                  name: id_conta_judicial
                  type: BIGINT
        - createSequence:
            incrementBy: 1
            minValue: 1
            sequenceName: SEQ_PAGAMENTO_ALVARA
            startValue: 1
        - addForeignKeyConstraint:
            baseColumnNames: id_conta
            baseTableName: PAGAMENTO_ALVARA
            constraintName: FK_PAG_ALVARA_CONTA
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: CONTA
        - addForeignKeyConstraint:
            baseColumnNames: id_alvara
            baseTableName: PAGAMENTO_ALVARA
            constraintName: FK_PAG_ALVARA_ALVARA
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: ALVARA
        - addForeignKeyConstraint:
            baseColumnNames: id_conta_judicial
            baseTableName: PAGAMENTO_ALVARA
            constraintName: FK_PAG_ALVARA_CONTA_JUD
            deferreable: true
            initiallyDeferred: true
            onDelete: No Action
            onUpdate: No Action
            referencedColumnNames: id
            referencedTableName: CONTA_JUDICIAL


